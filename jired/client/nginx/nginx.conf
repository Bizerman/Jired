server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Явный маршрут для группировки задач (чтобы точно обработать)
    location = /api/group-issues {
        proxy_pass http://middleware:3001/api/group-issues;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Остальные API-запросы (на будущее)
    location /api/ {
        proxy_pass http://middleware:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование к Redmine
    location /redmine/ {
        proxy_pass http://redmine:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header WWW-Authenticate;
    }

    # Отдача SPA
    location / {
        try_files $uri /index.html;
    }
}